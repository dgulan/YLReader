# YReader 本地编排（App + PostgreSQL + Redis + Frontend 静态托管）
# 注意：宿主机 5432 已被本机 PostgreSQL 16.15 占用，故 postgres 服务不暴露宿主端口（仅容器内网）。
# frontend 容器仅做静态托管（nginx:80）；生产网关需在 nginx 或反向代理层将 /api 转发到 app:8080。
services:
  app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://yreader:yreader@postgres:5432/yreader?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /var/lib/yreader/storage
    volumes:
      - storagedata:/var/lib/yreader/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yreader
      POSTGRES_PASSWORD: yreader
      POSTGRES_DB: yreader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yreader -d yreader"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
